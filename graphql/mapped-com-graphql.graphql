"""One log line a Connector wrote for its users."""
type ConnectorLog {
  """The log's level."""
  level: ConnectorLogLevel

  """The log's text."""
  message: String

  """
  Structured context the Connector attached to the log (a device id, a request id), as key and value pairs. Searchable with filter.metadata, or with key:value in filter.query.
  """
  metadata: [ConnectorLogMetadataEntry]

  """
  The time the Connector gave the log, to the millisecond. Connectors that send their logs through the connector SDK or the connector runtime kit add each log's position in the batch they send, in milliseconds, so a log can show up to about half a second after it was written.
  """
  timestamp: DateTime
}

"""The number of logs of one level in one time bucket."""
type ConnectorLogCountByLevelBucket {
  """How many logs of this level fall in the bucket, inside the period."""
  count: Long

  """The level counted."""
  level: ConnectorLogLevel

  """The start of the bucket, aligned to bucketSeconds."""
  timestamp: DateTime
}

"""
Selects Connector logs; every field set narrows the result. A field set both in query and in its structured filter (level, message, metadata, timestamp) is refused.
"""
input ConnectorLogFilterInput {
  """The Connector, set from the parent Connector."""
  connectorId: IDFilterExpressionInput

  """
  The levels to keep, all of them when empty. LEVEL_UNSPECIFIED is ignored.
  """
  level: [ConnectorLogLevelInput]

  """
  A filter on the log text. eq and in match the whole text, contains a part of it, and the CaseInsensitive variants ignore case; ne keeps the logs that do not contain the value and nin those whose whole text is none of the values; re is a regular expression found anywhere in the text.
  """
  message: StringFilterExpressionInput

  """
  A filter on the structured metadata. key names an entry and value filters it like message, except that ne means not equal and re must match the whole value; and, or and not combine filters (all, at least one, none). A log without the key reads as an empty value.
  """
  metadata: StringMapStringFilterExpressionInput

  """
  A search in the syntax of the logs screen, a Lucene subset. A word or "phrase" finds text in the message, /regex/ a pattern, -"phrase" leaves it out, and "a" OR "b" finds either; a query holds one such message term. key:value, key:(a OR b), key:val*, key:/regex/ and -key:value (or NOT key:value) match metadata; level:INFO and level:(INFO OR ERROR) select levels; timestamp:[2026-10-01 TO *] sets the period. AND (or a space), OR and parentheses combine terms, but an OR cannot mix a message term with key:value terms, nor involve level or timestamp. Operators are uppercase; a lowercase and, or or not is a word to find. At most 4,096 characters.
  """
  query: String

  """
  The period, with gte inclusive and lte exclusive. Without lte it ends now; without gte it starts 24 hours before its end. At most 30 days.
  """
  timestamp: TimestampRangeFilterExpressionInput
}

"""The level of a Connector log, from TRACE, the most detailed, to FATAL."""
enum ConnectorLogLevel {
  DEBUG
  ERROR
  FATAL
  INFO

  """No level. Ignored when filtering."""
  LEVEL_UNSPECIFIED
  TRACE
  WARN
}

"""The level of a Connector log, from TRACE, the most detailed, to FATAL."""
enum ConnectorLogLevelInput {
