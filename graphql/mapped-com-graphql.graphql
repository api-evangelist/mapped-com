"""
Abstract. One degree of freedom between two things, as the ontology's joint family states it.
"""
interface KinematicJoint implements GraphNode {
  connectedDataSourceId: String

  """
  An id in the coordinate-frame registry - the frame jointAxis is expressed in.
  """
  coordinateFrameId: String
  dateCreated: DateTime
  dateUpdated: DateTime
  description: String
  exactType: String

  """The thing this joint moves."""
  hasJointChild(filter: ThingFilter, transitive: Boolean = false): Thing
  hasJointChildEdges: [HasJointChildEdge]

  """The thing this joint is fixed to."""
  hasJointParent(filter: ThingFilter, transitive: Boolean = false): Thing
  hasJointParentEdges: [HasJointParentEdge]

  """The point or points whose value is this joint's state."""
  hasPoint(filter: PointFilter, transitive: Boolean = false): [Point]
  hasPointEdges: [HasPointEdge]

  """The authored physics-joint prim."""
  hasPrimBinding(filter: OpenUSDPrimBindingFilter, transitive: Boolean = false): [OpenUSDPrimBinding]
  hasPrimBindingEdges: [HasPrimBindingEdge]
  id: String!

  """
  The things this joint belongs to - the assembly that declares it with hasJoint.
  """
  isJointOf(filter: ThingFilter): [Thing]
  isJointOfEdges: [IsJointOfEdge]

  """
  Signed unit axis in the joint frame, three components. A reversed wheel is a negated axis.
  """
  jointAxis: [Float]
  mappingKey: String
  name: String
  type: [String]
}

input KinematicJointFilter {
  and: [KinematicJointFilter]
  connectedDataSourceId: StringFilterExpressionInput
  exactType: StringFilterExpressionInput
  id: IDFilterExpressionInput
  mappingKey: StringFilterExpressionInput
  not: KinematicJointFilter
  or: [KinematicJointFilter]
}

