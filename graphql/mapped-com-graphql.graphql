"""Contains all the details of a building."""
type Building implements GraphNode & Place & ThingContainer {
  """
  The address of a building, contains fields that support international addresses.
  """
  address: Address
  calendarEvents(filter: CalendarEventFilter): [CalendarEvent]
  collections(filter: CollectionFilter): [Collection]
  connectedDataSourceId: String

  """Any connectors configured for a building will be listed here."""
  connectors(
    """
    This filter is most often used to restrict results to a specific connector or connectors.
    """
    filter: ConnectorFilterInput
  ): [Connector]

  """This timestamp represents the date the building was created."""
  dateCreated: DateTime

  """This timestamp represents that date the building was last updated."""
  dateUpdated: DateTime

  """
  The description of a building; often left blank, especially if the building name is already descriptive.
  """
  description: String

  """
  The exactType is the most granular Brick Schema Location type defined for this building.
  """
  exactType: String

  """All the floors present in a building will be listed here."""
  floors(
    """
    This filter is most often used to restrict results to a specific floor or floors.
    """
    filter: FloorFilter
  ): [Floor]
  frameGeometry: GraphQLJSON
  geolocation(filter: GeoPointQuantityFilter, transitive: Boolean = false): GeoPointQuantity
  geolocationEdges: [GeolocationEdge]
  grossArea(filter: AreaQuantityFilter, transitive: Boolean = false): AreaQuantity
  grossAreaEdges: [GrossAreaEdge]
  hasExtendedProperty(filter: ExtendedPropertyFilter, transitive: Boolean = false): [ExtendedProperty]
  hasExtendedPropertyEdges: [HasExtendedPropertyEdge]
  hasPart(filter: PlaceFilter, transitive: Boolean = false): [Place]
  hasPartEdges: [HasPartEdge]

  """
  In some limited scenarios, a point may be associated with a building as opposed to a thing, like a building electrical meter. Those details will be provided here.
  """
  hasPoint(filter: PointFilter, transitive: Boolean = false): [Point]
  hasPointEdges: [HasPointEdge]
  hasPrimBinding(filter: OpenUSDPrimBindingFilter, transitive: Boolean = false): [OpenUSDPrimBinding]
  hasPrimBindingEdges: [HasPrimBindingEdge]
  hasPropertyContributedFrom: [BuildingHasPropertyContributedFromUnion]
  hasPropertyContributedFromEdges: [BuildingHasPropertyContributedFromEdge]

  """The unique ID of a building."""
  id: String!
  identities: [BuildingIdentityUnion]
  isAdjacentTo(filter: PlaceFilter, transitive: Boolean = false): [Place]
  isAdjacentToEdges: [IsAdjacentToEdge]
  isFedBy(filter: ThingFilter, transitive: Boolean = false): [Thing]
  isFedByEdges: [IsFedByEdge]

  """
  Superset of anything that could be in a building - a thing, a person, a meeting (people and meetings currently in development).
  """
  isLocationOf(filter: EntityFilter): [IsLocationOfUnion]
  isLocationOfEdges: [IsLocationOfEdge]

  """
  This contains the next level up in the place hierarchy; for a building, this will contain site information.
  """
  isPartOf(filter: PlaceFilter, transitive: Boolean = false): [Place]
  isPartOfEdges: [IsPartOfEdge]
  isServedBy(filter: ThingFilter): [Thing]
  isServedByEdges: [IsServedByEdge]
  mappingKey: String

  """The name of a building; often just the street address."""
  name: String
  places(filter: PlaceFilter): [Place]

  """Any of the points available inside a building will be listed here."""
  points(
    """
    This filter is most often used to restrict results to a specific point or points.
    """
    filter: PointFilter
  ): [Point]

  """
  Cursor paginated variant of "points". Prefer it over "points" whenever an organization can have a large number of points - it pages results through the search index instead of materializing every match.
  """
  pointsPaginated(
    """
    This filter is most often used to restrict results to a specific point or points.
    """
    filter: PointFilter

    """
    Cursor pagination controls - use "first"/"after" to page forward and "last"/"before" to page backward.
    """
    pagination: PageInfoInput
  ): PointsConnection
  rentableArea(filter: AreaQuantityFilter, transitive: Boolean = false): AreaQuantity
  rentableAreaEdges: [RentableAreaEdge]

  """The site associated with a building."""
  sites(
    """
    This filter is most often used to restrict results to a specific site or sites.
    """
    filter: SiteFilter
  ): [Site]
  spaces(childDepth: Int, filter: SpaceFilter): [Space]

  """
  Cursor paginated variant of "spaces". Prefer it over "spaces" whenever an organization can have a large number of spaces - it pages results through the search index instead of materializing every match.
  """
  spacesPaginated(
    filter: SpaceFilter

    """
    Cursor pagination controls - use "first"/"after" to page forward and "last"/"before" to page backward.
    """
    pagination: PageInfoInput
  ): SpacesConnection
  subBuildings(filter: SubBuildingFilter): [SubBuilding]

  """
  All the things associated with a building, or any floor or space in the building, will show here.
  """
  things(
    """
    This filter is most often used to restrict results to a specific thing or things.
    """
    filter: ThingFilter
  ): [Thing]
  timeZone: String

  """
  Type includes all possible hierarchal types for the building, such as "Place" and "Building".
  """
  type: [String]
  usableArea(filter: AreaQuantityFilter, transitive: Boolean = false): AreaQuantity
  usableAreaEdges: [UsableAreaEdge]
  zones(filter: ZoneFilter): [Zone]
}

