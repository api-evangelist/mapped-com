  isServedBy(filter: ThingFilter): [Thing]
  isServedByEdges: [IsServedByEdge]
  mappingKey: String
  name: String
  places(filter: PlaceFilter): [Place]
  points(filter: PointFilter): [Point]

  """
  Cursor paginated variant of "points". Prefer it over "points" whenever an organization can have a large number of points - it pages results through the search index instead of materializing every match.
  """
  pointsPaginated(
    filter: PointFilter

    """
    Cursor pagination controls - use "first"/"after" to page forward and "last"/"before" to page backward.
    """
    pagination: PageInfoInput
  ): PointsConnection
  rentableArea(filter: AreaQuantityFilter, transitive: Boolean = false): AreaQuantity
  rentableAreaEdges: [RentableAreaEdge]
  things(filter: ThingFilter): [Thing]
  type: [String]
  usableArea(filter: AreaQuantityFilter, transitive: Boolean = false): AreaQuantity
  usableAreaEdges: [UsableAreaEdge]
}

input ZoneFilter {
  and: [ZoneFilter]
  connectedDataSourceId: StringFilterExpressionInput
  dateCreated: TimestampFilterExpressionInput
  dateUpdated: TimestampFilterExpressionInput
  exactType: StringFilterExpressionInput
  id: IDFilterExpressionInput
  mappingKey: StringFilterExpressionInput
  name: StringFilterExpressionInput
  not: ZoneFilter
  or: [ZoneFilter]
  type: StringArrayFilterExpressionInput
}

type ZoneHasPropertyContributedFromEdge {
  connectedDataSourceId: String
  mappingKey: String
  node: ZoneHasPropertyContributedFromUnion
  propertyName: String
  selected: Boolean
}

union ZoneHasPropertyContributedFromUnion = Building | Floor | GenericPlace | NameIdentity | PostalAddressIdentity | PropertyBag | Site | Space | SubBuilding | Zone

union ZoneIdentityUnion = AccessCredentialIdentity | BACnetObjectId | BACnetVendorId | EmailAddressIdentity | EmailIdentity | ExternalIdentity | FloorLevelIdentity | GenericIdentity | NameIdentity | PostalAddressIdentity | SpaceCode | SubBuildingCode
