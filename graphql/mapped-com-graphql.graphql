"""
A durable, resolvable OpenUSD artifact. Root layers additionally carry the stage metadata - units, up axis, handedness, time-code rate - which is where USD stores it. Runtime stages and prims are deliberately not modelled; a binding resolves in a layer.
"""
type OpenUSDLayer implements GraphNode {
  """
  The USD asset path the author wrote. Identity, not a location - use contentUrl to fetch the bytes.
  """
  assetIdentifier: String
  connectedDataSourceId: String

  """
  Digest of the layer's bytes, "sha256:<64 hex>". Verify downloads against it and key caches on it.
  """
  contentHash: String

  """
  A URL the caller can GET to receive exactly the bytes contentHash names. Opaque and
  possibly short-lived: do not parse it, persist it, or derive sibling URLs from it -
  composition dependencies are found through referencesLayer. Null when Mapped cannot
  serve the bytes; never an error. Nullable String so a signed URL can replace the
  pass-through later without a schema change.
    
  The relationMapping is what pulls the asset identifier into the projection when the
  client did not select assetIdentifier - the fix #2949 made for Connector.contributions.
  parentField names the VERTEX property, not the GraphQL field: core reads it straight
  off the source map (RelationMappingConverter#getSourceFieldValue), which is why
  Thing.model maps deviceModelId and not a field Thing has. Hence openUSDAssetIdentifier.
  """
  contentUrl: String
  dateCreated: DateTime
  dateUpdated: DateTime
  description: String
  exactType: String

  """
  Absolute Sdf paths of the materials this layer's author reviewed as glass. Paths, not names - a material name is not unique across scopes under composition.
  """
  glassMaterialPaths: [String]

  """The opacity floor a renderer applies to those materials, 0 to 1."""
  glassMinimumOpacity: Float

  """RIGHT_HANDED or LEFT_HANDED."""
  handedness: String
  id: String!

  """The layers that reference this one."""
  isReferencedByLayer(filter: OpenUSDLayerFilter): [OpenUSDLayer]
  isReferencedByLayerEdges: [IsReferencedByLayerEdge]

  """Stage metadata; present on layers that are opened as a stage root."""
  kilogramsPerUnit: Float
  mappingKey: String

  """Stage metadata; present on layers that are opened as a stage root."""
  metersPerUnit: Float
  name: String

  """
  Composition dependencies - the layers this one references, as payloads or sublayers. One predicate covers sublayer, reference and payload arcs, because impact analysis, pinning and cache warming are all arc-kind agnostic.
  """
  referencesLayer(filter: OpenUSDLayerFilter, transitive: Boolean = false): [OpenUSDLayer]
  referencesLayerEdges: [ReferencesLayerEdge]

  """
  The asset-resolver context a stage must be opened under for this layer's asset paths to resolve.
  """
  resolverContext: String

  """The bindings that resolve in this layer."""
  resolvesPrimBinding(filter: OpenUSDPrimBindingFilter): [OpenUSDPrimBinding]
  resolvesPrimBindingEdges: [ResolvesPrimBindingEdge]

  """
  The load, population and variant policy a stage opened on this layer is expected to use.
  """
  schemaProfile: String

  """Stage metadata; present on layers that are opened as a stage root."""
  timeCodesPerSecond: Float
  type: [String]

  """Authored up axis, in USD's spelling - Y or Z."""
  upAxis: String
}

input OpenUSDLayerFilter {
  and: [OpenUSDLayerFilter]
  assetIdentifier: StringFilterExpressionInput
  connectedDataSourceId: StringFilterExpressionInput
  contentHash: StringFilterExpressionInput
  exactType: StringFilterExpressionInput
  id: IDFilterExpressionInput
  mappingKey: StringFilterExpressionInput
  not: OpenUSDLayerFilter
  or: [OpenUSDLayerFilter]
}

"""
A reified binding from a semantic vertex to one prim address in one layer. It has its own identity because a relationship carries no property bag and the association needs provenance and a validity window. Its properties describe the association - where it points, what it expects to find, whether it may drive pose - never intrinsic prim facts. A binding with hasLODItem edges is a level-of-detail root; an item binding is owned through its root.
"""
type OpenUSDPrimBinding implements GraphNode {
  connectedDataSourceId: String

  """
  The coordinate-frame registry entry coordinateFrameId names. Null when the binding
  names no frame, and null - not an error - when it names one the registry does not
  hold: a stale frame id is data, and it must not fail a list of a thousand bindings.
  """
  coordinateFrame: CoordinateFrame

  """
  An id in the coordinate-frame registry. Opaque to the graph - see coordinateFrame for the frame itself.
  """
  coordinateFrameId: String
  dateCreated: DateTime
  dateUpdated: DateTime
  description: String
  exactType: String

  """
  The level-of-detail selection policies of this root binding. Several per root, one per consumer domain, so thresholds cannot be flattened onto the binding.
  """
  hasLODHeuristic(filter: OpenUSDLODHeuristicFilter): [OpenUSDLODHeuristic]

  """
  The immediate level-of-detail items of this root binding, in no guaranteed order - sort by lodIndex.
  """
  hasLODItem(filter: OpenUSDPrimBindingFilter): [OpenUSDPrimBinding]
  id: String!

  """
  Whether this binding is the one allowed to drive the entity's pose. At most one binding per entity should claim it.
  """
  isAuthoritativeForPose: Boolean

  """The heuristics whose extent this binding's prim governs."""
  isLODBoundingVolumeOf(filter: OpenUSDLODHeuristicFilter): [OpenUSDLODHeuristic]

  """
  The roots that use this binding as a level-of-detail item. Item bindings are shared - a thousand roots may name the same three items.
  """
  isLODItemOf(filter: OpenUSDPrimBindingFilter): [OpenUSDPrimBinding]

  """
  What this binding represents - a Thing, a Place, a Point, a Person - or a joint, whose binding names the authored physics-joint prim.
  """
  isPrimBindingOf(filter: EntityFilter): [IsPrimBindingOfUnion]

  """
  Level-of-detail roots only - the item index to show when no heuristic applies.
  """
  lodDefaultIndex: Int

  """
  Level-of-detail items only - the item's position in its root's list, 0 being the most detailed.
  """
  lodIndex: Int

  """The item index to force when lodOverrideMode selects one."""
  lodOverrideIndex: Int

  """
  In USD's spelling - inherited, noOverride, indexedLOD, noLOD or allLOD.
  """
  lodOverrideMode: String

  """
  The last level-of-detail index at which this binding's prim exists. Absent means every level. A joint's or a wheel's prim is typically authored at level 0 only.
  """
  lodValidThroughIndex: Int
  mappingKey: String
  name: String

  """Absolute SdfPath of the bound prim in the composed layer."""
  primPath: String

  """What the binding expects to find at primPath, e.g. Xform."""
  primTypeName: String

  """USD purpose token in USD's spelling - default, render, proxy or guide."""
  purpose: String

  """The API schemas the prim at primPath is expected to have applied."""
  requiredAPISchemas: [String]

  """
  The layer this binding resolves through. Open a stage with it as the root layer under the resolver context and schema profile it names, then evaluate the binding against the composed prim at primPath.
  """
  resolvesInLayer(filter: OpenUSDLayerFilter, transitive: Boolean = false): OpenUSDLayer
  resolvesInLayerEdges: [ResolvesInLayerEdge]
  type: [String]

  """Start of the binding's validity window."""
  validFrom: DateTime

  """End of the binding's validity window."""
  validThrough: DateTime

  """
  The variant selections to apply when composing, as a JSON object of variant set to selection.
  """
  variantSelections: GraphQLJSON
}

input OpenUSDPrimBindingFilter {
  and: [OpenUSDPrimBindingFilter]
  connectedDataSourceId: StringFilterExpressionInput
  coordinateFrameId: StringFilterExpressionInput
  exactType: StringFilterExpressionInput
  id: IDFilterExpressionInput
  isAuthoritativeForPose: BoolFilterExpressionInput
  lodIndex: IntFilterExpressionInput
  lodValidThroughIndex: IntFilterExpressionInput
  mappingKey: StringFilterExpressionInput
  not: OpenUSDPrimBindingFilter
  or: [OpenUSDPrimBindingFilter]
  primPath: StringFilterExpressionInput
  purpose: StringFilterExpressionInput
}

