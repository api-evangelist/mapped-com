"""Contains the details about the point, such as a thermostat setpoint."""
type Point implements GraphNode {
  """
  Time series data gathered together to return a new value, such as an average temperature across a set time pe or a min or max value.
  """
  aggregation(
    """The ending timestamp for the aggregated series data."""
    endTime: DateTime

    """
    The interval of time to use for the aggregation. Supports DAY, HOUR and MINUTE.
    """
    period: TimeseriesAggPeriodInput
    periodIncrement: Int

    """The starting timestamp for the aggregated series data."""
    startTime: DateTime
  ): [TimeseriesAggregateRow]
  connectedDataSourceId: String
  datatype: DatatypeKey

  """This timestamp represents the date the point was created."""
  dateCreated: DateTime

  """This timestamp represents that date the point was last updated."""
  dateUpdated: DateTime

  """The description of the point, like "Cooling Temperature Setpoint"."""
  description: String

  """
  This is the most specific type available for the point, i.e. where 'type' may return a list like [Point, Alarm, TemperatureAlarm, HighTemperatureAlarm], exactType will return just HighTemperatureAlarm.
  """
  exactType: String
  hasBill(filter: PointFilter): [Point]
  hasDerivation(filter: PointFilter, transitive: Boolean = false): [Point]
  hasDerivationEdges: [HasDerivationEdge]
  hasExtendedProperty(filter: ExtendedPropertyFilter, transitive: Boolean = false): [ExtendedProperty]
  hasExtendedPropertyEdges: [HasExtendedPropertyEdge]
  hasExternalReference(filter: EntityFilter, transitive: Boolean = false): [HasExternalReferenceUnion]
  hasExternalReferenceEdges: [HasExternalReferenceEdge]
  hasHeartbeat(filter: HeartbeatFilter, transitive: Boolean = false): Heartbeat
  hasHeartbeatEdges: [HasHeartbeatEdge]
  hasPrimBinding(filter: OpenUSDPrimBindingFilter, transitive: Boolean = false): [OpenUSDPrimBinding]
  hasPrimBindingEdges: [HasPrimBindingEdge]
  hasPropertyContributedFrom: [PointHasPropertyContributedFromUnion]
  hasPropertyContributedFromEdges: [PointHasPropertyContributedFromEdge]

  """The unique ID of the point."""
  id: String!
  identities: [PointIdentityUnion]
  isBilledTo(filter: AccountFilter): Account
  isBilledToEdges: [IsBilledToEdge]
  isDerivedFrom(filter: PointFilter): [Point]
  isDerivedFromEdges: [IsDerivedFromEdge]
  isHostedBy(filter: ThingFilter): [Thing]
  isHostedByEdges: [IsHostedByEdge]
  isPartOf(filter: CollectionFilter): [Collection]
  isPartOfEdges: [IsPartOfEdge]
  isPointOf(filter: EntityFilter): [IsPointOfUnion]
  isPointOfEdges: [IsPointOfEdge]
  mappingKey: String

  """The name assigned to the point."""
  name: String

  """
  Time series data for the point, such as what the air temperature setpoint was for a VAV, limited by a defined start and end time.
  """
  series(
    """The ending timestamp for the series data."""
    endTime: DateTime

    """
    If set to 'true', will return the last timeseries value we have for the point.
    """
    latest: Boolean

    """The starting timestamp for the series data."""
    startTime: DateTime
  ): [TimeseriesRow]

  """
  Ordered list of additional descriptive data to help explain float values like 0.0, 1.0 and 2.0.
  """
  stateTexts: [String]

  """
  The class or subclass of the point, like "Alarm" and "TemperatureAlarm".
  """
  type: [String]

  """The unit of measurement associated with this point, such as "Degrees"."""
  unit: Unit
  unused: Boolean
  valueMap: Map
}

