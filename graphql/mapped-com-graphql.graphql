"""Contains the details about the floor."""
type Floor implements GraphNode & Place & ThingContainer {
  """Contains the details of the building where the floor is present."""
  building: Building!
  calendarEvents(filter: CalendarEventFilter): [CalendarEvent]
  collections(filter: CollectionFilter): [Collection]
  connectedDataSourceId: String

  """Any connectors configured for the floor will be listed here."""
  connectors(
    """
    This is the filter for the connectors field, most often used to restrict results to a specific connector or connectors.
    """
    filter: ConnectorFilterInput
  ): [Connector]

  """This timestamp represents the date the floor was created."""
  dateCreated: DateTime

  """This timestamp represents that date the floor was last updated."""
  dateUpdated: DateTime

  """
  The description of the floor; often left blank, especially if the floor name is already descriptive.
  """
  description: String
  exactType: String
  frameGeometry: GraphQLJSON

  """
  The geographic shape of the floor, represented by latitude/longitude coordinate pairs.
  """
  geoshape: GeoJSON
  grossArea(filter: AreaQuantityFilter, transitive: Boolean = false): AreaQuantity
  grossAreaEdges: [GrossAreaEdge]
  hasExtendedProperty(filter: ExtendedPropertyFilter, transitive: Boolean = false): [ExtendedProperty]
  hasExtendedPropertyEdges: [HasExtendedPropertyEdge]

  """Lists the spaces on the floor - spaces are "part of" a floor."""
  hasPart(filter: PlaceFilter, transitive: Boolean = false): [Place]
  hasPartEdges: [HasPartEdge]
  hasPoint(filter: PointFilter, transitive: Boolean = false): [Point]
  hasPointEdges: [HasPointEdge]
  hasPrimBinding(filter: OpenUSDPrimBindingFilter, transitive: Boolean = false): [OpenUSDPrimBinding]
  hasPrimBindingEdges: [HasPrimBindingEdge]
  hasPropertyContributedFrom: [FloorHasPropertyContributedFromUnion]
  hasPropertyContributedFromEdges: [FloorHasPropertyContributedFromEdge]

  """The unique ID of the floor."""
  id: String!
  identities: [FloorIdentityUnion]
  isAdjacentTo(filter: PlaceFilter, transitive: Boolean = false): [Place]
  isAdjacentToEdges: [IsAdjacentToEdge]
  isFedBy(filter: ThingFilter, transitive: Boolean = false): [Thing]
  isFedByEdges: [IsFedByEdge]
  isLocationOf(filter: EntityFilter): [IsLocationOfUnion]
  isLocationOfEdges: [IsLocationOfEdge]

  """
  This contains the next level up in the place hierarchy; for a floor, this will contain building information.
  """
  isPartOf(filter: PlaceFilter): [Place]
  isPartOfEdges: [IsPartOfEdge]
  isServedBy(filter: ThingFilter): [Thing]
  isServedByEdges: [IsServedByEdge]

  """
  This is the floor level represented numerically. Starting at 0 for ground floor, with basement levels below ground floor identified as negative numbers.
  """
  level: Int
  mappingKey: String

  """The name of the floor, typically just a number or "floor1", "floor2"."""
  name: String
  places(filter: PlaceFilter): [Place]

  """Any of the points available on the floor will be listed here."""
  points(
    """
    This filter is most often used to restrict results to a specific point or points.
    """
    filter: PointFilter
  ): [Point]

  """
  Cursor paginated variant of "points". Prefer it over "points" whenever an organization can have a large number of points - it pages results through the search index instead of materializing every match.
  """
  pointsPaginated(
    """
    This filter is most often used to restrict results to a specific point or points.
    """
    filter: PointFilter

    """
    Cursor pagination controls - use "first"/"after" to page forward and "last"/"before" to page backward.
    """
    pagination: PageInfoInput
  ): PointsConnection
  rentableArea(filter: AreaQuantityFilter, transitive: Boolean = false): AreaQuantity
  rentableAreaEdges: [RentableAreaEdge]

  """All the spaces present on the floor will be listed here."""
  spaces(
    childDepth: Int

    """
    This filter is most often used to restrict results to a specific space or spaces.
    """
    filter: SpaceFilter
  ): [Space]

  """
  Cursor paginated variant of "spaces". Prefer it over "spaces" whenever an organization can have a large number of spaces - it pages results through the search index instead of materializing every match.
  """
  spacesPaginated(
    """
    This filter is most often used to restrict results to a specific space or spaces.
    """
    filter: SpaceFilter

    """
    Cursor pagination controls - use "first"/"after" to page forward and "last"/"before" to page backward.
    """
    pagination: PageInfoInput
  ): SpacesConnection

  """
  All the things associated with the floor, or any spaces on the floor, will show here.
  """
  things(
    """
    This filter is most often used to restrict results to a specific thing or things.
    """
    filter: ThingFilter
  ): [Thing]

  """
  Type includes all possible hierarchal types for the building, such as "Place" and "Floor".
  """
  type: [String]
  usableArea(filter: AreaQuantityFilter, transitive: Boolean = false): AreaQuantity
  usableAreaEdges: [UsableAreaEdge]

  """
  Currently in development; will show all the zones associated with the floor.
  """
  zones(
    """
    This filter is most often used to restrict results to a specific zone or zones.
    """
    filter: ZoneFilter
  ): [Zone]
}

