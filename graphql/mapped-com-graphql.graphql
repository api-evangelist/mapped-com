type Connector {
  baseUrl: String
  buildings(filter: BuildingFilter): [Building]

  """
  Any settings required in order to create a Connector will be provided here.
  """
  config: JSONSchema

  """
  Random string that identifies the current Connector configuration; if you need to update the configuration, you will need to include the current configHash value in the mutation request.
  """
  configHash: String

  """The type/category/vendor of a Connector, such as "Weather" or "Butlr"."""
  connectorType: ConnectorType

  """The unique id of the connector type."""
  connectorTypeId: String
  contributions: [ConnectorContribution]

  """Timestamp for the Connector's creation."""
  created: DateTime
  direction: ConnectorTypeConnectorDirection
  floors(filter: FloorFilter): [Floor]
  hostId: String

  """The unique id of a Connector."""
  id: String

  """The kinematic joints this Connector contributed."""
  kinematicJoints(filter: KinematicJointFilter): [KinematicJoint]
  lastSeen: DateTime
  lastUpdatedBy: String

  """
  How many of the Connector's logs each level has per time bucket, over the whole period, for a chart. Takes the same filter as logs. Buckets sit on a UTC grid aligned to bucketSeconds, the first and the last count only their part inside the period, and buckets and levels with no logs are left out.
  """
  logCountsByLevel(
    """
    The width of one bucket, in seconds. A positive whole number; a period that touches more than 10,000 buckets is refused, and the value is never clamped.
    """
    bucketSeconds: Int

    """Selects the logs to count, as in logs."""
    filter: ConnectorLogFilterInput
  ): [ConnectorLogCountByLevelBucket]

  """
  The Connector's customer-facing logs, newest first, a page at a time. The period comes from filter.timestamp or from a timestamp:[A TO B] clause in filter.query; it ends at lte (exclusive) or now, starts at gte (inclusive) or 24 hours before its end, and spans at most 30 days. Ask for the next page with the nextToken of the previous one and the same filter.
  """
  logs(
    """
    Selects the logs, by period, level and search (filter.query, or the structured message and metadata filters).
    """
    filter: ConnectorLogFilterInput

    """
    limit is the page size, 100 when unset; more than 1,000 is refused. A full page can hold more than limit, since it brings every log of its oldest millisecond and the next page starts before that millisecond; a millisecond holding more than 5,000 logs can come back incomplete. nextToken continues from the previous page; page numbers past 1 are refused.
    """
    pagination: PaginationInput
  ): ConnectorLogListResponse

  """The name of a Connector you provided when setting it up for your org."""
  name: String

  """
  The OpenUSD level-of-detail selection policies this Connector contributed.
  """
  openUSDLODHeuristics(filter: OpenUSDLODHeuristicFilter): [OpenUSDLODHeuristic]

  """The OpenUSD layers this Connector contributed."""
  openUSDLayers(filter: OpenUSDLayerFilter): [OpenUSDLayer]

  """The OpenUSD prim bindings this Connector contributed."""
  openUSDPrimBindings(filter: OpenUSDPrimBindingFilter): [OpenUSDPrimBinding]

  """
  Contains the details about the organization associated with this Connector.
  """
  organization: Org

  """Lists all the points returned by the Connector."""
  points(filter: PointFilter): [Point]

  """
  Cursor paginated variant of "points". Prefer it over "points" whenever an organization can have a large number of points - it pages results through the search index instead of materializing every match.
  """
  pointsPaginated(
    filter: PointFilter

    """
    Cursor pagination controls - use "first"/"after" to page forward and "last"/"before" to page backward.
    """
    pagination: PageInfoInput
  ): PointsConnection
  runtimeVersion: ConnectorTypeRuntimeVersion
  sites(filter: SiteFilter): [Site]
  spaces(filter: SpaceFilter): [Space]

  """
  Cursor paginated variant of "spaces". Prefer it over "spaces" whenever an organization can have a large number of spaces - it pages results through the search index instead of materializing every match.
  """
  spacesPaginated(
    filter: SpaceFilter

    """
    Cursor pagination controls - use "first"/"after" to page forward and "last"/"before" to page backward.
    """
    pagination: PageInfoInput
  ): SpacesConnection

  """Lists the state of a Connector, such as ACTIVE or STOPPED."""
  state: ConnectorState

  """
  Currently provides additional information about a Connector in an ERROR_GENERAL state.
  """
  stateDetails: String

  """Lists all the things returned by the Connector."""
  things(filter: ThingFilter): [Thing]

  """Timestamp when a connector was last updated."""
  updated: DateTime
  userId: String

  """
  This is an internal-only field; the value(s) included in this field may be requested by support for troubleshooting purposes, but otherwise holds no value for external developers.
  """
  workflowId: String
  zones(filter: ZoneFilter): [Zone]
}

