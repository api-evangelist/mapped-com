"""Queries retrieve data from the data store."""
type Query {
  accessConnectorAuth(input: ConnectorAuthAccessRequestInput): ConnectorAuthResponseSecret
  accessTokenFromPAT(input: PersonalAccessTokenGetAccessTokenFromPATRequestInput): String
  accounts(filter: AccountFilter): [Account]

  """
  Returns the complete list of Connector Types (type = category or vendor) available to you for install; this does not reflect which Connectors are already installed, use "connectors" for that query.
  """
  availableConnectorTypes(
    """
    This filter is typically used to restrict results to a specific connector type or types.
    """
    filter: ConnectorTypeFilterInput
    includeRequested: Boolean
    includeUponRequest: Boolean
  ): ConnectorTypeListAvailableResponse

  """
  Buildings are subsections of sites, where each site may have multiple associated buildings. Use this query to view building specific data such as id, name and geoshape.
  """
  buildings(
    """
    This filter is typically used to restrict results to a specific building or buildings.
    """
    filter: BuildingFilter
  ): [Building]

  """
  Currently in development; will be used in association with Connectors that expose calendar events such as scheduled meetings.
  """
  calendarEvents(
    """
    This filter is used to return information about a specific calendar event.
    """
    filter: CalendarEventFilter
  ): [CalendarEvent]

  """
  Cursor paginated variant of "calendarEvents". Prefer it over "calendarEvents" whenever an organization can have a large number of events - it pages results through the search index instead of materializing every match. The "hasInviteeEmail" filter is not supported here, because it is resolved by walking invitations in the graph rather than from a property on the event.
  """
  calendarEventsPaginated(
    """
    This filter is used to return information about a specific calendar event.
    """
    filter: CalendarEventFilter

    """
    Cursor pagination controls - use "first"/"after" to page forward and "last"/"before" to page backward.
    """
    pagination: PageInfoInput
  ): CalendarEventsConnection
  calendars(filter: CalendarFilter): [Calendar]
  collections(filter: CollectionFilter): [Collection]

  """Currently in development."""
  connectorAuth(
    """Provide the ID for the connector auth here."""
    id: String
  ): ConnectorAuth
  connectorEntitiesMigrationState(input: ConnectorEntityGetMigrationStateRequestInput): ConnectorEntityMigrationState
  connectorHosts(filter: ConnectorHostFilterInput): [ConnectorHost]

  """Currently in development."""
  connectorTypes(
    """
    This filter is most often used to restrict results to a specific connector type or types.
    """
    filter: ConnectorTypeFilterInput
  ): [ConnectorType]

  """
  Use this query to view data about the Connectors configured for the organization, including gateways.
  """
  connectors(
    """
    This filter is typically used to restrict results to a specific connector or connectors.
    """
    filter: ConnectorFilterInput
  ): [Connector]
  coordinateFrame(id: String): CoordinateFrame
  coordinateFrameVersions(id: String): [CoordinateFrame]
  coordinateFrames(filter: CoordinateFrameFilterInput): [CoordinateFrame]
  enabledFeatures(featureIds: [String], targetId: String): [Feature]

  """
  Returns the single entity matching the lookup key, or null if there is none.
  """
  entity(by: EntityLookup!): Entity

  """
  Floors are subsections of buildings, typically identified numerically like "floor1". Use this query to view floor specific data such as id, name or geoshape.
  """
  floors(
    """
    This filter is typically used to restrict results to a specific floor or floors.
    """
    filter: FloorFilter
  ): [Floor]
  frameTransform(id: String): FrameTransform
  frameTransformVersions(id: String): [FrameTransform]
  frameTransforms(filter: FrameTransformFilterInput): [FrameTransform]

  """
  Provides details about the gateways associated with the organization, such as id or provisioning/active status.
  """
  gateways(
    """
    This filter is typically used to restrict results to a specific gateway or gateways.
    """
    filter: GatewayFilterInput
  ): [Gateway]
  getConnectorEntityRulesDeclarationTypes(input: ConnectorEntityGetRulesDeclarationTypesRequestInput): ConnectorEntityGetRulesDeclarationTypesResponse
  getOrgMembershipsUser: [UserOrgDetail]
  gramlSyncJobs(filter: GramlSyncJobListFilterInput, gramlId: String): [GramlSyncJob]
  gramlVersions(filter: GramlVersionListFilterInput, gramlId: String): [GramlVersion]
  gramls(connectorId: String, filter: GramlListFilterInput): [Graml]

  """
  Currently in development; will be used to list details about grants that provide access rights to parties outside the organization (like granting building tenants the right to view data about their spaces)
  """
  grants(
    """
    This filter is typically used to restrict results to a specific grant or grants.
    """
    filter: GrantFilterInput
  ): [Grant]

  """
  Invites are used to add additional users to the org. Use this query to return the list of user invites created by your org, including those that were ACCEPTED or still PENDING.
  """
  invites(
    """
    This filter typically used to restrict results to a specific invite or invites.
    """
    filter: InviteFilterInput
  ): [InviteDTO]
  isOrgNameAvailable(orgName: String): OrgIsOrgNameAvailableResponse
  isPatNameAvailable(name: String): PersonalAccessTokenIsPatNameAvailableResponse
  jobs(filter: JobListFilterInput, latest: Boolean): [BaseJob]

  """
  Every kinematic joint in the organization - one degree of freedom between two things, prismatic or revolute. Read alongside openUSDPrimBindings; each joint binds the authored physics-joint prim and names the point that reports its state.
  """
  kinematicJoints(
    """
    This filter is most often used to restrict results to one kind of joint, or to a specific joint.
    """
    filter: KinematicJointFilter
  ): [KinematicJoint]
  leases(filter: LeaseFilter): [Lease]
  listConnectorEntities(input: ConnectorEntityListRequestInput): ConnectorEntityListResponse
  listConnectorEntitiesMigrationEntities(input: ConnectorEntityListMigrationEntitiesRequestInput): ConnectorEntityListMigrationEntitiesResponse
  listConnectorEntitiesMigrationOrphans(input: ConnectorEntityListMigrationOrphansRequestInput): ConnectorEntityListMigrationOrphansResponse
  listConnectorEntitySourceTypes(input: ConnectorEntityListSourceTypesRequestInput): ConnectorEntityListSourceTypesResponse

  """
  Live queries are GraphQL queries created once and then remain active, monitoring for changes perpetually for easy retrieval. Typically paired with a webhook to get proactive notificiations of changes pushed to an endpoint.
  """
  liveQueries(
    """
    This filter typically used to restrict results to a specific live query or queries.
    """
    filter: LiveQueryFilterInput
  ): [LiveQuery]

  """
  Use this query to view data about the user associated with the token, such as name or id.
  """
  me: User

  """
  Every OpenUSD level-of-detail selection policy in the organization. One of the three flat lists a renderer reads a scene from; join it to openUSDPrimBindings by id rather than nesting, so a heuristic shared by a thousand bindings arrives once.
  """
  openUSDLODHeuristics(
    """
    This filter is most often used to restrict results to one consumer domain, or to a specific heuristic.
    """
    filter: OpenUSDLODHeuristicFilter
  ): [OpenUSDLODHeuristic]

  """
  Every OpenUSD layer in the organization. Ask for contentHash to key a cache, and contentUrl to fetch the bytes.
  """
  openUSDLayers(
    """
    This filter is most often used to ask which of a set of contentHash values a client already holds are still current.
    """
    filter: OpenUSDLayerFilter
  ): [OpenUSDLayer]

  """
  Every OpenUSD prim binding in the organization; each one ties a semantic vertex to one prim address in one layer. The read a renderer makes, alongside openUSDLayers and openUSDLODHeuristics.
  """
  openUSDPrimBindings(
    """
    This filter is most often used to restrict results to a level-of-detail index, a purpose, or a specific binding.
    """
    filter: OpenUSDPrimBindingFilter
  ): [OpenUSDPrimBinding]
  orgRoleGroups(filter: OrgRoleGroupFilterInput): [OrgRoleGroupDTO]
  orgServiceAccounts(filter: OrgServiceAccountFilterInput): [OrgServiceAccountContainer]

  """
  Use this query to view data about the organization associated with the the token, such as name or id.
  """
  organization: Org

  """
  Currently in development and will be used in with connectors that expose information about individuals, such as calendar events.
  """
  people(
    """This filter is used to return information about a specific person."""
    filter: PersonFilter
  ): [Person]
  places(filter: PlaceFilter): [Place]

  """
  A particular output at a particular time, like on/off for a device like a light. For more complex devices like a thermostat, points could be the ambient temperature in the room, what temperature is set, is the thermostat set to heat or set to cool.
  """
  points(
    """
    This filter is typically used to restrict results to a specific point or points.
    """
    filter: PointFilter
  ): [Point]

  """
  Cursor paginated variant of "points". Prefer it over "points" whenever an organization can have a large number of points - it pages results through the search index instead of materializing every match.
  """
  pointsPaginated(
    """
    This filter is typically used to restrict results to a specific point or points.
    """
    filter: PointFilter

    """
    Cursor pagination controls - use "first"/"after" to page forward and "last"/"before" to page backward.
    """
    pagination: PageInfoInput
  ): PointsConnection

  """For internal use only."""
  productBundleSubscriptions: [BillingProductBundleSubscriptionResponse]
  roleManagers(filter: RoleManagerFilterInput): [RoleManagerRoleDTO]
  serviceRequests(filter: ServiceRequestFilter): [ServiceRequest]

  """
  Sites are the top level place - they contain buildings, which contain floors, which contain spaces. Use this query to view site specific data such as id, name or geoshape.
  """
  sites(
    """
    This filter is typically used to restrict results to a specific site or sites.
    """
    filter: SiteFilter
  ): [Site]

  """
  Spaces are subsections of a floor, such as an office or a breakroom. Use this query to view space specific data such as id, name or geoshape.
  """
  spaces(
    """
    This filter is typically used to restrict results to a specific space or spaces.
    """
    filter: SpaceFilter
  ): [Space]

  """
  Cursor paginated variant of "spaces". Prefer it over "spaces" whenever an organization can have a large number of spaces - it pages results through the search index instead of materializing every match.
  """
  spacesPaginated(
    """
    This filter is typically used to restrict results to a specific space or spaces.
    """
    filter: SpaceFilter

    """
    Cursor pagination controls - use "first"/"after" to page forward and "last"/"before" to page backward.
    """
    pagination: PageInfoInput
  ): SpacesConnection
  subBuildings(filter: SubBuildingFilter): [SubBuilding]
  suggestEquivalentSpaces(input: SpaceMappingSuggestEquivalentSpacesRequestInput): [SpaceMappingSuggestedEquivalentSpaces]
  suggestFloorLevels(input: SpaceMappingSuggestFloorLevelsRequestInput): [SpaceMappingFloorLevelSuggestion]
  suggestSpaceCodes(input: SpaceMappingSuggestSpaceCodesRequestInput): [SpaceMappingSpaceCodeSuggestion]

  """
  All the devices in your places - HVAC systems, security systems, lighting, badge readers, elevators and similar.
  """
  things(
    """
    This filter is most often used torestrict results to a specific thing or things.
    """
    filter: ThingFilter
  ): [Thing]

  """
  This will return information about the tokens in your account, or if you're an admin, you can look at tokens for other users. Note this will not return the actual Personal Access Token, only the token record id and data like the name and scopes.
  """
  tokens(
    """
    This filter is typically used to restrict results to a specific token or tokens.
    """
    filter: PersonalAccessTokenFilterInput
  ): [PersonalAccessToken]

  """
  Predefined / global list containing units of measurement for point data, such as "Degrees". Used for timeseries data comprehension, i.e. series data for a point shows "65", units helps you understand that means 65 degrees.
  """
  units(
    """
    This filter is typically used to restrict results to a specific unit or units.
    """
    filter: UnitFilterInput
  ): [Unit]

  """
  If you're an admin, use this query to retrieve data about users. If you're a non-admin user, you can review the listed data about yourself.
  """
  users(
    """
    This filter is typically used to restrict results to a specific user or users.
    """
    filter: UserFilterInput
  ): [User]

  """Used to return data about webhook targets created by org admins."""
  webhookTargets(
    """This filter is used to return information about a specific webhook."""
    filter: WebhookTargetFilterInput
  ): [WebhookTarget]
  workOrders(filter: WorkOrderFilter): [WorkOrder]

  """
  Cursor paginated variant of "workOrders". Prefer it over "workOrders" whenever an organization can have a large number of work orders - it pages results through the search index instead of materializing every match.
  """
  workOrdersPaginated(
    filter: WorkOrderFilter

    """
    Cursor pagination controls - use "first"/"after" to page forward and "last"/"before" to page backward.
    """
    pagination: PageInfoInput
  ): WorkOrdersConnection
  zones(filter: ZoneFilter): [Zone]
}

