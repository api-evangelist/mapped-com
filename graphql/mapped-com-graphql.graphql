"""
An identity attached to an entity. All four fields are required: together they are the
indexed key, so a partial identity is rejected instead of being answered with a scan.
"""
input EntityIdentityLookup {
  """
  The stored exactType of the identity, as returned by `identities { exactType }`, for example SpaceCode or Name_Identity.
  """
  exactType: String!

  """The scope the identity is unique within."""
  scope: ScopeKeyInput!

  """
  The id of the scope entity, for example the building id when scope is BUILDING.
  """
  scopeId: String!

  """The identity value."""
  value: String!
}

"""Identifies one entity by exactly one of its keys."""
input EntityLookup {
  """The entity id."""
  id: String

  """
  An identity attached to the entity; resolves to the entity that owns it.
  """
  identity: EntityIdentityLookup

  """The entity mapping key."""
  mappingKey: String
}

