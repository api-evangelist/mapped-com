apis:
- aid: mapped-com:mapped-graphql-api
  name: Mapped GraphQL API
  description: The Mapped API is a single GraphQL endpoint exposing every query, mutation and type of the Mapped building world model (70 queries, 99 mutations), authenticated with a Personal Access Token sent in the Authorization header as "token <PAT>". Schema captured by anonymous introspection of https://api.mapped.com/graphql on 2026-10-18.
  humanURL: https://docs.mapped.com/api
  baseURL: https://api.mapped.com/graphql
  tags:
  - GraphQL
  - Smart Buildings
  - Ontology
  properties:
  - type: GraphQL
    url: graphql/mapped-com-graphql.graphql
  - type: GraphQL
    name: GraphQL Introspection (JSON)
    url: graphql/mapped-com-graphql-introspection.json
  - type: Documentation
    url: https://docs.mapped.com/api
- aid: mapped-com:mapped-mcp-server
  name: Mapped MCP Server
  description: Hosted Mapped Model Context Protocol server with two tool sets - GraphQL generation and execution against the Mapped API, and Mapped ontology navigation. The endpoint answers anonymous tools/list with 401 and an OAuth protected-resource challenge.
  humanURL: https://docs.mapped.com/guides/mcp/introduction-to-mapped-mcp
  baseURL: https://mcp.mapped.com/mcp
  tags:
  - MCP
  - AI Agents
  tags_raw:
  - Model Context Protocol
  - AI Agents
  properties:
  - type: Documentation
    url: https://docs.mapped.com/guides/mcp/introduction-to-mapped-mcp

